name: Thin Host CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.MSS_PACKAGES_READ_TOKEN || github.token }}

jobs:
  contracts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.2
          cache: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.1
          registry-url: https://npm.pkg.github.com
          scope: '@mss-boot-sys'
      - run: corepack enable
      - run: corepack pnpm@10.34.5 --dir web install --frozen-lockfile
      - name: Install exact mss release tools
        run: |
          curl --fail --location --silent --show-error \
            --output "${RUNNER_TEMP}/install-mss.sh" \
            https://github.com/mss-boot-sys/mss-boot-admin/releases/download/__MSS_DISTRIBUTION_VERSION__/install-mss.sh
          bash "${RUNNER_TEMP}/install-mss.sh" \
            --version __MSS_DISTRIBUTION_VERSION__ \
            --install-dir "${RUNNER_TEMP}/mss-bin"
          echo "${RUNNER_TEMP}/mss-bin" >> "${GITHUB_PATH}"
      - run: mss doctor --strict
      - run: mss verify --all

  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: 1.27.2
          cache: true
      - run: GOWORK=off go test ./...
      - run: GOWORK=off go vet ./...
      - run: GOWORK=off go build ./cmd/server

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.13.1
          registry-url: https://npm.pkg.github.com
          scope: '@mss-boot-sys'
      - run: corepack enable
      - run: corepack pnpm@10.34.5 install --frozen-lockfile
      - run: corepack pnpm@10.34.5 lint
      - run: corepack pnpm@10.34.5 test
      - run: corepack pnpm@10.34.5 build
