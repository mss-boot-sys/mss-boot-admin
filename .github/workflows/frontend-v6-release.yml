name: Frontend V6 Release
'on':
  push:
    tags:
    - web/antd-v6/v*.*.*
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
  CI: 'true'
  HUSKY: '0'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/mss-boot-admin-antd-v6
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: release-v6-auto
    permissions:
      contents: write
      pull-requests: read
      packages: write
    steps:
    - name: Require authorized release operator
      env:
        RELEASE_ACTOR_LOGIN: mss-boot-sys
      run: |
        set -euo pipefail
        test "${GITHUB_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"
        test "${GITHUB_TRIGGERING_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"
    - name: Checkout release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Verify merged-main source and release version
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 tools/release/verify_publication.py --component frontend
    - name: Setup pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      with:
        version: 10.34.5
    - name: Setup Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: web/antd-v6/pnpm-lock.yaml
    - name: Install frozen V6 dependencies
      run: pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
      working-directory: web/antd-v6
    - name: Build same-origin primary V6 frontend
      run: pnpm run build:release
      working-directory: web/antd-v6
    - name: Embed and verify primary V6 release identity
      env:
        RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        jq -n \
          --arg application 'mss-boot-admin-antd-v6' \
          --arg version "${RELEASE_VERSION}" \
          --arg commit "${RELEASE_COMMIT}" \
          '{application: $application, version: $version, commit: $commit}' > dist/release.json
        jq -e \
          --arg version "${RELEASE_VERSION}" \
          --arg commit "${RELEASE_COMMIT}" \
          '.application == "mss-boot-admin-antd-v6" and .version == $version and .commit == $commit' \
          dist/release.json >/dev/null
      working-directory: web/antd-v6
    - name: Package and verify portable primary V6 artifact
      env:
        RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        python3 ../../tools/release/check_portable_paths.py dist
        {
          echo 'application=mss-boot-admin-antd-v6'
          echo "version=${RELEASE_VERSION}"
          echo "commit=${RELEASE_COMMIT}"
        } > FRONTEND-V6-BUILD-INFO
        source_epoch="$(git show -s --format=%ct "${RELEASE_COMMIT}")"
        tar \
          --sort=name \
          --mtime="@${source_epoch}" \
          --owner=0 \
          --group=0 \
          --numeric-owner \
          --create \
          --gzip \
          --file dist-v6.tar.gz \
          dist
        sha256sum dist-v6.tar.gz FRONTEND-V6-BUILD-INFO > SHA256SUMS.frontend-v6
        sha256sum --check SHA256SUMS.frontend-v6
        python3 ../../tools/release/check_portable_paths.py \
          dist-v6.tar.gz \
          FRONTEND-V6-BUILD-INFO \
          SHA256SUMS.frontend-v6
      working-directory: web/antd-v6
    - name: Pack exact Admin Web package and release evidence
      env:
        RELEASE_VERSION: ${{ steps.identity.outputs.version }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        candidate_root="$(mktemp -d)"
        trap 'rm -rf "${candidate_root}"' EXIT
        package_dir="${GITHUB_WORKSPACE}/web/antd-v6/admin-web-release-package"
        mkdir -p "${candidate_root}/source" "${package_dir}"
        git -C ../.. -c core.autocrlf=false archive \
          --format=tar \
          "${RELEASE_COMMIT}:web/antd-v6" \
          | tar -xf - -C "${candidate_root}/source"
        python3 - \
          "${candidate_root}/source/package.json" \
          "${RELEASE_VERSION#v}" \
          "${RELEASE_COMMIT}" <<'PY'
        import json
        from pathlib import Path
        import sys

        path = Path(sys.argv[1]).resolve()
        manifest = json.loads(path.read_text(encoding="utf-8"))
        if manifest.get("name") != "@mss-boot-sys/admin-web" or manifest.get("private") is True:
            raise SystemExit("Admin Web candidate source has an unexpected identity")
        manifest["version"] = sys.argv[2]
        manifest["gitHead"] = sys.argv[3]
        path.write_text(
            json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
            encoding="utf-8",
        )
        PY
        (
          cd "${candidate_root}/source"
          pnpm pack --pack-destination "${package_dir}" >/dev/null
        )
        mapfile -t candidate_tarballs < <(
          find "${package_dir}" -maxdepth 1 -type f -name '*.tgz' -print
        )
        [[ ${#candidate_tarballs[@]} -eq 1 ]]
        tarball="${candidate_tarballs[0]}"

        pnpm list --prod --json --depth Infinity > "${package_dir}/pnpm-tree.json"
        created="$(date -u -d "$(git show -s --format=%cI "${RELEASE_COMMIT}")" '+%Y-%m-%dT%H:%M:%SZ')"
        python3 ../../tools/release/verify_admin_web_package.py \
          --tarball "${tarball}" \
          --expected-name '@mss-boot-sys/admin-web' \
          --expected-version "${RELEASE_VERSION#v}" \
          --source-repository "${GITHUB_REPOSITORY}" \
          --source-commit "${RELEASE_COMMIT}" \
          --output "${package_dir}/admin-web-package.json"
        python3 ../../tools/release/generate_admin_web_sbom.py \
          --dependency-tree "${package_dir}/pnpm-tree.json" \
          --package-evidence "${package_dir}/admin-web-package.json" \
          --source-repository "${GITHUB_REPOSITORY}" \
          --source-commit "${RELEASE_COMMIT}" \
          --created "${created}" \
          --output "${package_dir}/admin-web.spdx.json"
        rm -f "${package_dir}/pnpm-tree.json"
        (
          cd "${package_dir}"
          sha256sum -- *.tgz admin-web-package.json admin-web.spdx.json \
            > SHA256SUMS.admin-web
          sha256sum --check SHA256SUMS.admin-web
        )
        python3 ../../tools/release/check_portable_paths.py \
          "${tarball}" \
          "${package_dir}/admin-web-package.json" \
          "${package_dir}/admin-web.spdx.json" \
          "${package_dir}/SHA256SUMS.admin-web"
      working-directory: web/antd-v6
    - name: Publish immutable GitHub Packages version
      env:
        NODE_AUTH_TOKEN: ${{ github.token }}
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ steps.identity.outputs.version }}
      run: |
        python3 tools/release/publish_github_package.py --directory web/antd-v6/admin-web-release-package --version "${RELEASE_VERSION#v}"
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log into registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Publish immutable multi-platform frontend image
      env:
        RELEASE_VERSION: ${{ steps.identity.outputs.version }}
      run: |
        bash tools/release/publish_image.sh frontend
    - name: Collect release assets
      run: |
        mkdir release-assets
        cp web/antd-v6/dist-v6.tar.gz web/antd-v6/FRONTEND-V6-BUILD-INFO web/antd-v6/SHA256SUMS.frontend-v6 release-assets/
        cp web/antd-v6/admin-web-release-package/* release-assets/
    - name: Publish immutable frontend release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 tools/release/publish_release_assets.py --directory release-assets
