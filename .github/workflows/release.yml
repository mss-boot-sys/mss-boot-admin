name: Root Release
'on':
  push:
    tags:
    - v*.*.*
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.identity.outputs.version }}
      commit: ${{ github.sha }}
    steps:
    - name: Require authorized release operator
      env:
        RELEASE_ACTOR_LOGIN: mss-boot-sys
      run: |
        set -euo pipefail
        test "${GITHUB_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"
        test "${GITHUB_TRIGGERING_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"
    - name: Checkout release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Verify merged-main source and release version
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 tools/release/verify_publication.py --component root
  backend-build:
    needs: metadata
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        os:
        - linux
        - windows
        - darwin
        arch:
        - amd64
        - arm64
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: admin/go.mod
        cache: true
        cache-dependency-path: |
          go.sum
          go.work.sum
          admin/go.sum
          mss-boot/go.sum
    - name: Build Admin runtime and Agent tools
      env:
        CGO_ENABLED: 0
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      run: |
        set -euo pipefail
        package="mss-boot-admin-${GOOS}-${GOARCH}"
        suffix=""
        if [[ "${GOOS}" == "windows" ]]; then
          suffix=".exe"
        fi
        release_timestamp="$(git show -s --format=%cI "${RELEASE_COMMIT}")"
        [[ "${release_timestamp}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]]

        mkdir -p "${package}/config" "${package}/foundation"
        admin_ldflags="-s -w -X github.com/mss-boot-sys/mss-boot-admin/admin/pkg.Version=${RELEASE_VERSION} -X github.com/mss-boot-sys/mss-boot-admin/admin/pkg.Commit=${RELEASE_COMMIT}"
        agent_ldflags="-s -w -X github.com/mss-boot-sys/mss-boot-admin/internal/mss/buildinfo.Version=${RELEASE_VERSION} -X github.com/mss-boot-sys/mss-boot-admin/internal/mss/buildinfo.Commit=${RELEASE_COMMIT} -X github.com/mss-boot-sys/mss-boot-admin/internal/mss/buildinfo.Timestamp=${release_timestamp}"
        go build -trimpath -ldflags "${admin_ldflags}" -o "${package}/admin${suffix}" ./admin
        GOWORK=off go build -trimpath -ldflags "${agent_ldflags}" -o "${package}/mss${suffix}" ./cmd/mss
        GOWORK=off go build -trimpath -ldflags "${agent_ldflags}" -o "${package}/mss-mcp${suffix}" ./cmd/mss-mcp

        {
          echo "version=${RELEASE_VERSION}"
          echo "commit=${RELEASE_COMMIT}"
          echo "timestamp=${release_timestamp}"
        } > "${package}/BUILD-INFO"

        cp -a admin/config/*.yml "${package}/config/"
        cp AGENTS.md CLAUDE.md LICENSE README.md README.zh-CN.md "${package}/"
        cp admin/README.md "${package}/ADMIN.md"
        cp -a .mss/schemas .mss/blueprints "${package}/foundation/"
        cp -a .agents/skills "${package}/foundation/skills"
        cp .codex/README.md "${package}/foundation/CODEX.md"
        cp -a docs/docs/agent "${package}/foundation/docs"

        if [[ "${GOOS}/${GOARCH}" == "linux/amd64" ]]; then
          for command in admin mss mss-mcp; do
            output="$("${package}/${command}" --version)"
            [[ "${output}" == *"${RELEASE_VERSION}"* ]]
            [[ "${output}" == *"${RELEASE_COMMIT}"* ]]
          done
          for command in mss mss-mcp; do
            output="$("${package}/${command}" --version)"
            [[ "${output}" == *"${release_timestamp}"* ]]
          done
        fi
    - name: Verify portable runtime artifact paths
      run: python3 tools/release/check_portable_paths.py mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}
    - name: Upload runtime artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}
        path: mss-boot-admin-${{ matrix.os }}-${{ matrix.arch }}
        if-no-files-found: error
  frontend-build:
    needs: metadata
    runs-on: ubuntu-24.04
    steps:
    - name: Download published exact frontend archive
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        mkdir frontend-v6-dist
        gh release download "web/antd-v6/${RELEASE_VERSION}" --repo "${GITHUB_REPOSITORY}" --dir frontend-v6-dist --pattern dist-v6.tar.gz --pattern FRONTEND-V6-BUILD-INFO --pattern SHA256SUMS.frontend-v6
        (cd frontend-v6-dist && sha256sum --check SHA256SUMS.frontend-v6)
        grep -Fx "version=${RELEASE_VERSION}" frontend-v6-dist/FRONTEND-V6-BUILD-INFO
        grep -Fx "commit=${RELEASE_COMMIT}" frontend-v6-dist/FRONTEND-V6-BUILD-INFO
    - name: Upload primary V6 artifact
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: frontend-v6-dist
        path: frontend-v6-dist/*
        if-no-files-found: error
  assemble:
    needs:
    - metadata
    - backend-build
    - frontend-build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - name: Checkout release validation tooling
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        sparse-checkout: |
          tools/install
          tools/release
    - name: Download all artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
    - name: Assemble release packages
      env:
        RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        RELEASE_COMMIT: ${{ needs.metadata.outputs.commit }}
      run: |
        set -euo pipefail
        [[ "$(git rev-parse HEAD)" == "${RELEASE_COMMIT}" ]]
        release_timestamp="$(git show -s --format=%cI "${RELEASE_COMMIT}")"
        source_date_epoch="$(git show -s --format=%ct "${RELEASE_COMMIT}")"
        [[ "${release_timestamp}" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}([+-][0-9]{2}:[0-9]{2}|Z)$ ]]
        [[ "${source_date_epoch}" =~ ^[0-9]+$ ]]

        test -d frontend-v6-dist
        (
          cd frontend-v6-dist
          sha256sum --check SHA256SUMS.frontend-v6
        )
        python3 tools/release/check_portable_paths.py \
          frontend-v6-dist/dist-v6.tar.gz \
          frontend-v6-dist/FRONTEND-V6-BUILD-INFO \
          frontend-v6-dist/SHA256SUMS.frontend-v6
        mkdir frontend-v6-extracted
        tar --extract --gzip \
          --file frontend-v6-dist/dist-v6.tar.gz \
          --directory frontend-v6-extracted
        python3 tools/release/check_portable_paths.py frontend-v6-extracted/dist
        jq -e \
          --arg version "${RELEASE_VERSION}" \
          --arg commit "${RELEASE_COMMIT}" \
          '.application == "mss-boot-admin-antd-v6" and .version == $version and .commit == $commit' \
          frontend-v6-extracted/dist/release.json >/dev/null
        runtime_dirs=(
          mss-boot-admin-linux-amd64
          mss-boot-admin-linux-arm64
          mss-boot-admin-darwin-amd64
          mss-boot-admin-darwin-arm64
          mss-boot-admin-windows-amd64
          mss-boot-admin-windows-arm64
        )
        reference_build_info="${runtime_dirs[0]}/BUILD-INFO"
        reference_license="${runtime_dirs[0]}/LICENSE"
        grep -Fx "version=${RELEASE_VERSION}" "${reference_build_info}" >/dev/null
        grep -Fx "commit=${RELEASE_COMMIT}" "${reference_build_info}" >/dev/null
        grep -Fx "timestamp=${release_timestamp}" "${reference_build_info}" >/dev/null
        [[ "$(wc -l < "${reference_build_info}")" -eq 3 ]]

        for dir in "${runtime_dirs[@]}"; do
          test -d "${dir}"
          test -f "${dir}/LICENSE"
          cmp -- "${reference_build_info}" "${dir}/BUILD-INFO"
          cmp -- "${reference_license}" "${dir}/LICENSE"
          rm -rf "${dir}/dist"
          cp -a frontend-v6-extracted/dist "${dir}/dist"
          case "${dir}" in
            mss-boot-admin-linux-*|mss-boot-admin-darwin-*)
              chmod 0755 "${dir}/admin" "${dir}/mss" "${dir}/mss-mcp"
              ;;
          esac
          find "${dir}" -exec touch --date="@${source_date_epoch}" {} +
          find "${dir}" -print | LC_ALL=C sort | TZ=UTC zip -X -q "${dir}.zip" -@
        done
        python3 tools/release/check_portable_paths.py mss-boot-admin-*.zip

        mkdir tool-staging
        tool_assets=(
          "mss-tools-${RELEASE_VERSION}-linux-amd64.tar.gz"
          "mss-tools-${RELEASE_VERSION}-linux-arm64.tar.gz"
          "mss-tools-${RELEASE_VERSION}-darwin-amd64.tar.gz"
          "mss-tools-${RELEASE_VERSION}-darwin-arm64.tar.gz"
          "mss-tools-${RELEASE_VERSION}-windows-amd64.zip"
          "mss-tools-${RELEASE_VERSION}-windows-arm64.zip"
        )
        for dir in "${runtime_dirs[@]}"; do
          platform_arch="${dir#mss-boot-admin-}"
          stage="tool-staging/${platform_arch}"
          mkdir "${stage}"
          cp "${dir}/BUILD-INFO" "${dir}/LICENSE" "${stage}/"
          case "${platform_arch}" in
            windows-*)
              cp "${dir}/mss.exe" "${dir}/mss-mcp.exe" "${stage}/"
              chmod 0644 "${stage}/BUILD-INFO" "${stage}/LICENSE"
              chmod 0755 "${stage}/mss.exe" "${stage}/mss-mcp.exe"
              touch --date="@${source_date_epoch}" "${stage}"/*
              archive_path="${PWD}/mss-tools-${RELEASE_VERSION}-${platform_arch}.zip"
              (
                cd "${stage}"
                TZ=UTC zip -X -q "${archive_path}" \
                  BUILD-INFO LICENSE mss.exe mss-mcp.exe
              )
              ;;
            linux-*|darwin-*)
              cp "${dir}/mss" "${dir}/mss-mcp" "${stage}/"
              chmod 0644 "${stage}/BUILD-INFO" "${stage}/LICENSE"
              chmod 0755 "${stage}/mss" "${stage}/mss-mcp"
              tar \
                --sort=name \
                --format=gnu \
                --owner=0 \
                --group=0 \
                --numeric-owner \
                --mtime="@${source_date_epoch}" \
                --directory="${stage}" \
                --create \
                --file=- \
                BUILD-INFO LICENSE mss mss-mcp \
                | gzip -n > "mss-tools-${RELEASE_VERSION}-${platform_arch}.tar.gz"
              ;;
            *)
              echo "unsupported tool platform: ${platform_arch}" >&2
              exit 1
              ;;
          esac
        done

        expected_unix_entries=$'BUILD-INFO\nLICENSE\nmss\nmss-mcp'
        for archive in mss-tools-${RELEASE_VERSION}-{linux,darwin}-{amd64,arm64}.tar.gz; do
          actual_entries="$(tar -tzf "${archive}" | sed 's#^\./##' | LC_ALL=C sort)"
          [[ "${actual_entries}" == "${expected_unix_entries}" ]]
        done
        expected_windows_entries=$'BUILD-INFO\nLICENSE\nmss-mcp.exe\nmss.exe'
        for archive in mss-tools-${RELEASE_VERSION}-windows-{amd64,arm64}.zip; do
          actual_entries="$(unzip -Z1 "${archive}" | sed 's#^\./##' | LC_ALL=C sort)"
          [[ "${actual_entries}" == "${expected_windows_entries}" ]]
        done

        install -m 0755 tools/install/install-mss.sh install-mss.sh
        install -m 0644 tools/install/install-mss.ps1 install-mss.ps1
        grep -Fx "readonly DEFAULT_VERSION=\"${RELEASE_VERSION}\"" install-mss.sh >/dev/null
        grep -Fx "    [string]\$Version = '${RELEASE_VERSION}'," install-mss.ps1 >/dev/null
        bash -n install-mss.sh
        python3 tools/release/check_portable_paths.py \
          "${tool_assets[@]}" install-mss.sh install-mss.ps1

        sha256sum mss-boot-admin-*.zip > SHA256SUMS
        sha256sum "${tool_assets[@]}" install-mss.sh install-mss.ps1 \
          > "SHA256SUMS.tools-${RELEASE_VERSION}"
        [[ "$(wc -l < SHA256SUMS)" -eq 6 ]]
        [[ "$(wc -l < "SHA256SUMS.tools-${RELEASE_VERSION}")" -eq 8 ]]
        sha256sum --check SHA256SUMS
        sha256sum --check "SHA256SUMS.tools-${RELEASE_VERSION}"
    - name: Upload assembled packages
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: release-packages-${{ needs.metadata.outputs.version }}
        path: |
          mss-boot-admin-*.zip
          SHA256SUMS
          mss-tools-*.tar.gz
          mss-tools-*.zip
          SHA256SUMS.tools-*
          install-mss.sh
          install-mss.ps1
        if-no-files-found: error
        retention-days: 30
  publish:
    needs:
    - metadata
    - assemble
    runs-on: ubuntu-24.04
    environment: release-auto
    permissions:
      contents: write
      pull-requests: read
    steps:
    - name: Require authorized release operator
      env:
        RELEASE_ACTOR_LOGIN: mss-boot-sys
      run: |
        set -euo pipefail
        test "${GITHUB_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"
        test "${GITHUB_TRIGGERING_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"
    - name: Checkout release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Verify merged-main source and release version
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 tools/release/verify_publication.py --component root
    - name: Download release archives
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-packages-${{ needs.metadata.outputs.version }}
        path: release-assets
    - name: Publish immutable Root release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        python3 tools/release/publish_release_assets.py --directory release-assets --latest
