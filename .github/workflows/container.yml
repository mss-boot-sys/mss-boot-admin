name: Container
'on':
  push:
    tags:
    - v*.*.*
permissions:
  contents: read
  pull-requests: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  GOTOOLCHAIN: local
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-auto
    permissions:
      contents: read
      pull-requests: read
      packages: write
    steps:
    - name: Require authorized release operator
      env:
        RELEASE_ACTOR_LOGIN: mss-boot-sys
      run: 'set -euo pipefail

        test "${GITHUB_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"

        test "${GITHUB_TRIGGERING_ACTOR}" = "${RELEASE_ACTOR_LOGIN}"

        '
    - name: Checkout release source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        fetch-depth: 0
    - name: Verify merged-main source and release version
      id: identity
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'python3 tools/release/verify_publication.py --component root

        '
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
      with:
        go-version-file: admin/go.mod
        cache: true
        cache-dependency-path: 'go.sum

          go.work.sum

          admin/go.sum

          mss-boot/go.sum

          '
    - name: Vendor workspace for Docker context
      run: 'go work vendor

        '
    - name: Set up QEMU
      uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
    - name: Log into registry
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ github.token }}
    - name: Publish immutable multi-platform Root image
      env:
        RELEASE_VERSION: ${{ steps.identity.outputs.version }}
      run: 'bash tools/release/publish_image.sh root

        '
